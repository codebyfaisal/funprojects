<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Login Form</title>
    <link rel="stylesheet"
        href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/media.css" />
</head>

<body>
    <div class="container">
        <div class="col form-img">
            <div class="welcome">
                <h1>Welcome</h1>
                <h1>Back!</h1>
            </div>

            <div class="welcome none">
                <h1>Join us!</h1>
                <h5>Create your account and start your journey with us.</h5>
            </div>
        </div>

        <!-- Login form -->
        <form id="login-form" class="col form">
            <div class="form-group form-head">
                <h1>Login</h1>
                <label>Welcome back! Please login to your account.</label>
            </div>

            <div class="form-body">
                <div class="form-group">
                    <label for="login-username" class="form-label">Username</label>
                    <div class="inner-group">
                        <input type="text" id="login-username" class="form-control" />
                        <i class="las la-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="inner-group">
                        <input type="password" id="login-password" class="form-control" />
                        <i class="las la-unlock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" class="form-control" />
                        <label for="remember" class="form-label">Remember me</label>
                    </div>

                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <div class="form-group">
                    <button type="submit" id="login-submit" class="btn form-control">
                        Login
                    </button>
                </div>
            </div>

            <div class="form-group form-footer">
                <label>New user? <a href="#" id="goto-register-form">Sign up</a></label>
            </div>
        </form>

        <!-- Registration form -->
        <form id="register-form" class="col form none">
            <div class="form-group form-head">
                <h1>Register</h1>
                <label>Welcome to codebyfaisal! Please sign up for a new account.</label>
            </div>

            <div class="form-body">
                <div class="form-group">
                    <label for="register-username" class="form-label">Username</label>
                    <div class="inner-group">
                        <input type="text" id="register-username" class="form-control" />
                        <i class="las la-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-email" class="form-label">Email</label>
                    <div class="inner-group">
                        <input type="email" id="register-email" class="form-control" />
                        <i class="las la-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-password" class="form-label">Password</label>
                    <div class="inner-group">
                        <input type="password" id="register-password" class="form-control" />
                        <i class="las la-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" id="register-submit" class="btn form-control">
                        Register
                    </button>
                </div>
            </div>

            <div class="form-group form-footer">
                <label>Already a member? <a href="#" id="goto-login-form">Sign in</a></label>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
    
</html>
